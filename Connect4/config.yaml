network:
  num_res_blocks: 6
  num_filters: 64
  policy_conv_channels_out: 2
  value_conv_channels_out: 1
  value_lin1_out: 64

self_play:
  exploration_rate: 1.25
  num_simulations: 100
  num_games_per_batch: 20
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25

optimizer:
  learning_rate: 0.001  # Assuming Adam
  lambda_reg: 0.0001
  num_epochs: 5
  batch_size: 32

pipeline:
  num_iterations: 10